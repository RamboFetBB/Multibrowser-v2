name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configurar Ambiente Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar PWABuilder CLI para gerar TWA limpo
        run: npm install -g @pwabuilder/pwapush

      - name: Gerar Projeto Android via PWABuilder CLI
        run: |
          npx @pwabuilder/cli generate --manifest https://SEU-USUARIO.github.io/Multibrowser-v2/manifest.json --platforms android --output ./android-project || true
          
      - name: Compilar APK com Gradle
        run: |
          # Caso o PWABuilder gere os arquivos na raiz ou em pasta específica
          if [ -d "android-project/android" ]; then
            cd android-project/android
          elif [ -d "android" ]; then
            cd android
          else
            # Fallback: cria uma estrutura mínima de gradle se necessário
            echo "Estruturando build manual..."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: meu-multibrowser-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
