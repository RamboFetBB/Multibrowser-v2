name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configurar Ambiente Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Ferramenta Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Criar Manifest TWA e Compilar APK
        run: |
          # Cria um diretório limpo para o app Android
          mkdir -p android-app
          cd android-app
          
          # Gera o txa-manifest.json básico de forma programática para evitar prompts
          cat <<EOF > twa-manifest.json
          {
            "host": "SEU-USUARIO.github.io",
            "name": "MultiBrowser Mobile",
            "shortName": "MultiBrowser",
            "startUrl": "/Multibrowser-v2/",
            "themeColor": "#121212",
            "navigationColor": "#121212",
            "backgroundColor": "#121212",
            "display": "standalone",
            "orientation": "any",
            "appVersionName": "1.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "iconUrl": "https://SEU-USUARIO.github.io/Multibrowser-v2/icon.png",
            "maskableIconUrl": "https://SEU-USUARIO.github.io/Multibrowser-v2/icon.png",
            "webManifestUrl": "https://SEU-USUARIO.github.io/Multibrowser-v2/manifest.json",
            "generatorApp": "bubblewrap-cli"
          }
          EOF

          # Executa o build direto usando o manifesto gerado
          bubblewrap update --manifest twa-manifest.json
          bubblewrap build --skip manifest validation

      - name: Enviar APK como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: meu-multibrowser-apk
          path: |
            android-app/*.apk
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/apk/debug/*.apk
