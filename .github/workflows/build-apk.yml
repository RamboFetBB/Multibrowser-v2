name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Criar Projeto Android Nativo e Ícones de Compatibilidade
        run: |
          mkdir -p native-app/app/src/main/java/com/multibrowser/app
          mkdir -p native-app/app/src/main/res/layout
          mkdir -p native-app/app/src/main/res/values
          mkdir -p native-app/app/src/main/res/mipmap-hdpi

          cat << 'EOF' > native-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAGElEQVR4nO2WMQ0AMAzDsuv/6TzRCRs5uS51qQUg2QAAAAAElFTkSuQmCC
          EOF
          cp native-app/app/src/main/res/mipmap-hdpi/ic_launcher.png native-app/app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          # AndroidManifest.xml
          cat << 'EOF' > native-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.multibrowser.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="MultiBrowser"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java configurado com o seu link exato
          cat << 'EOF' > native-app/app/src/main/java/com/multibrowser/app/MainActivity.java
          package com.multibrowser.app;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://RamboFetBB.github.io/Multibrowser-v2/");
                  
                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # build.gradle (Module)
          cat << 'EOF' > native-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.multibrowser.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.multibrowser.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          # build.gradle (Project)
          cat << 'EOF' > native-app/build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # settings.gradle
          cat << 'EOF' > native-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MultiBrowser"
          include ':app'
          EOF

          # gradle.properties
          echo "android.useAndroidX=true" > native-app/gradle.properties

      - name: Baixar e Configurar Gradle 8.2 Manualmente
        run: |
          cd native-app
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2

      - name: Compilar APK com Gradle 8.2
        run: |
          cd native-app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: multibrowser-apk
          path: native-app/app/build/outputs/apk/debug/app-debug.apk
