name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configurar Ambiente Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Ferramenta Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Inicializar Projeto Android Automaticamente
        run: |
          # Passa --manifest e responde automaticamente sem prompts interativos
          bubblewrap init --manifest=https://SEU-USUARIO.github.io/Multibrowser-v2/manifest.json --directory=android-app --skip_jdk_check || true

      - name: Compilar o APK
        run: |
          cd android-app
          bubblewrap build --skip manifest validation

      - name: Enviar APK como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: meu-multibrowser-apk
          path: |
            android-app/*.apk
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/apk/debug/*.apk
