<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MultiBrowser Pro - 4 Telas com Autoclick</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Grid Fixo 2x2 (4 Telas) -->
    <main id="browser-grid">
        <!-- Injetado dinamicamente via script.js -->
    </main>

    <!-- Botão Flutuante Global Estilizado -->
    <div id="floating-ball" title="Ocultar / Mostrar Telas (Background Ativo)">
        <i class="fa-solid fa-layer-group" id="ball-icon"></i>
        <div id="status-pulse"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
